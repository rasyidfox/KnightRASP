org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# Native library file name without the word "rasp" (to make fingerprinting harder).
# Used consistently by Gradle -> CMake (.so output) and Kotlin (System.loadLibrary).
knightrasp.nativeLibName=guardcore
